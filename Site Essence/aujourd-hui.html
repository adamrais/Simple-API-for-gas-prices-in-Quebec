<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Prix aujourd'hui</title>
    <style>
      body {
        background-color: #0f0f0f;
        color: #e0e0e0;
        font-family: sans-serif;
        padding: 20px;
      }
    #titre-principal {
        color: #4caf7d;
        font-family: Georgia, serif;
      }
    #nav button {
        background-color: transparent;
        color: #4caf7d;
        border: 1px solid #4caf7d;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
    }

    #nav button:hover {
        background-color: #4caf7d;
        color: #0f0f0f;
    }
    </style>
  </head>
  <body>
    <h1 id="titre-principal">Prix aujourd'hui</h1>
    <div id="nav">
      <a href="index.html"><button>Page d'accueil</button></a>
      <a href="historique.html"><button>Données historiques</button></a>
    </div>
    <div style="margin-top: 20px;">
      <p style="font-size: 16px; color: #4caf7d; margin: 5px 0;">Prix moyen à la pompe au Québec :</p>
      <h1 id="prix" style="font-size: 72px; margin: 0;">Chargement...</h1>
      <p id="baril" style="font-size: 18px; margin: 5px 0;">Chargement...</p>
      <p id="date" style="font-size: 14px; color: gray;margin: 5px 0;">Chargement...</p>
    </div>
    <script>
    fetch("http://127.0.0.1:8000/predict")
    .then(reponse => reponse.json())
    .then(data => {
      document.getElementById("prix").textContent = data.prix_predit_cents + " ¢/L";
      document.getElementById("baril").textContent = data.wti_usd + " USD$";
      document.getElementById("date").textContent = data.date;
    })
    </script>
  </body>
</html>
