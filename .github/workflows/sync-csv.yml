name: Sync CSV from Railway

on:
  # Primary trigger: Railway POSTs this right after the 10:00 fetch completes.
  # Dispatch events are not subject to GitHub's scheduled-workflow delay.
  repository_dispatch:
    types: [csv-updated]
  # Fallback only, in case Railway is down. Off the congested :00/:30 slots.
  schedule:
    - cron: '17 16 * * *'  # ~12:17 PM Montreal time
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download CSVs from Railway
        run: |
          curl -f https://proessence.up.railway.app/prix/csv -o data/prix_quotidien.csv
          curl -f https://proessence.up.railway.app/prix/csv/regions -o data/prix_quotidien_regions.csv

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prix_quotidien.csv data/prix_quotidien_regions.csv
          git diff --cached --quiet || git commit -m "chore: sync daily CSV backup"
          git push
