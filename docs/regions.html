<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Prédiction par région</title>
    <style>
      body {
        background-color: white;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', sans-serif;
        padding: 20px;
        margin: 0;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main { flex: 1; }
      #titre-principal {
        color: #003DA5;
        font-size: 80px;
        font-weight: bold;
        text-align: center;
        margin: 0;
        border-bottom: 4px solid #003DA5;
        padding: 10px 20px;
        display: inline-block;
      }
      #nav {
        text-align: center;
        margin-top: 20px;
      }
      #nav button {
        background-color: white;
        color: #003DA5;
        border: 2px solid #003DA5;
        border-radius: 8px;
        padding: 10px 28px;
        font-size: 20px;
        font-family: 'Lucida Sans', sans-serif;
        cursor: pointer;
        margin: 0 8px;
        transition: background-color 0.2s, color 0.2s;
      }
      #nav button:hover {
        background-color: #003DA5;
        color: white;
      }
      #region-select {
        margin-top: 32px;
        font-size: 20px;
        padding: 10px 20px;
        border: 2px solid #003DA5;
        border-radius: 8px;
        color: #003DA5;
        font-family: 'Lucida Sans', sans-serif;
        cursor: pointer;
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="titre-principal">Prédiction par région</h1>

      <div id="nav">
        <a href="index.html"><button>Accueil</button></a>
        <a href="aujourd-hui.html"><button>Prix aujourd'hui</button></a>
        <a href="prediction.html"><button>Prédiction Québec</button></a>
        <a href="historique.html"><button>Données historiques</button></a>
        <a href="historique-regions.html"><button>Historique par région</button></a>
      </div>

      <div>
        <select id="region-select"><option>Chargement...</option></select>
      </div>

      <div style="display: flex; justify-content: center; align-items: flex-start; gap: 40px; margin-top: 40px; flex-wrap: wrap;">
        <canvas id="graphique" width="700" height="400"></canvas>
        <div id="Tableau" style="color: black; min-width: 300px;"></div>
      </div>
    </main>

    <footer style="background-color: #003DA5; color: white; padding: 20px 40px; text-align: center;">
      <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Accueil</a>
      <a href="aujourd-hui.html" style="color: white; text-decoration: none; margin: 0 15px;">Prix aujourd'hui</a>
      <a href="prediction.html" style="color: white; text-decoration: none; margin: 0 15px;">Prédiction</a>
      <a href="historique.html" style="color: white; text-decoration: none; margin: 0 15px;">Données historiques</a>
      <a href="historique-regions.html" style="color: white; text-decoration: none; margin: 0 15px;">Historique par région</a>
      <p style="font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 12px; margin-bottom: 0;">
        Conditions d'utilisation &nbsp;|&nbsp; Politique de confidentialité &nbsp;|&nbsp; Contactez-nous
      </p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script>
      let allPredictions = {};
      let chart = null;

      function renderRegion(region) {
        const preds = allPredictions[region];
        if (!preds) return;

        const labels = preds.map(p => p.date);
        const moyen = preds.map(p => p.moyen);
        const optimiste = preds.map(p => p.optimiste);
        const pessimiste = preds.map(p => p.pessimiste);

        if (chart) chart.destroy();
        chart = new Chart(document.getElementById("graphique"), {
          type: "line",
          data: {
            labels,
            datasets: [
              { label: "Pessimiste", data: pessimiste, borderColor: "#e74c3c", borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false },
              { label: "Moyen", data: moyen, borderColor: "#003DA5", borderWidth: 3, pointRadius: 5, pointBackgroundColor: "#003DA5", fill: false },
              { label: "Optimiste", data: optimiste, borderColor: "#2ecc71", borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false }
            ]
          },
          options: {
            responsive: false,
            plugins: {
              legend: { display: true },
              tooltip: { mode: "index", intersect: false }
            },
            scales: {
              y: {
                ticks: { callback: v => v + "¢", font: { size: 14 } },
                grid: { color: "rgba(0,0,0,0.06)" }
              },
              x: {
                ticks: { font: { size: 13 } },
                grid: { display: false }
              }
            }
          }
        });

        const div = document.getElementById("Tableau");
        let html = `<table style="border-collapse: collapse; width: 100%;">
          <tr>
            <th style="padding: 8px; border: 4px solid #003DA5; background-color: #003DA5; color: white;">Date</th>
            <th style="padding: 8px; border: 4px solid #003DA5; background-color: #3498db; color: white;">Optimiste</th>
            <th style="padding: 8px; border: 4px solid #003DA5; background-color: #4caf7d; color: white;">Moyen</th>
            <th style="padding: 8px; border: 4px solid #003DA5; background-color: #e74c3c; color: white;">Pessimiste</th>
          </tr>`;
        preds.forEach(p => {
          html += `<tr>
            <td style="padding: 8px; border: 4px solid #444; color: #003DA5;">${p.date}</td>
            <td style="padding: 8px; border: 4px solid #444; color: #3498db;">${p.optimiste}¢</td>
            <td style="padding: 8px; border: 4px solid #444; color: #4caf7d;">${p.moyen}¢</td>
            <td style="padding: 8px; border: 4px solid #444; color: #e74c3c;">${p.pessimiste}¢</td>
          </tr>`;
        });
        html += `</table>`;
        div.innerHTML = html;
      }

      fetch("https://proessence.up.railway.app/predict/regions?jours=7")
        .then(r => r.json())
        .then(data => {
          allPredictions = data.predictions;
          const regions = Object.keys(allPredictions).sort();
          const select = document.getElementById("region-select");
          select.innerHTML = regions.map(r => `<option value="${r}">${r}</option>`).join("");
          select.addEventListener("change", () => renderRegion(select.value));
          renderRegion(regions[0]);
        });
    </script>
  </body>
</html>
