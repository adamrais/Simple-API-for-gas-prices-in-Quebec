<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique par région</title>
    <style>
    body {
      background-color: white;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', sans-serif;
      padding: 20px;
      margin: 0;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main { flex: 1; }
    #titre-principal {
      color: #003DA5;
      font-size: 80px;
      font-weight: bold;
      text-align: center;
      margin: 0;
      border-bottom: 4px solid #003DA5;
      padding: 10px 20px;
      display: inline-block;
    }
    h2 {
      margin-top: 4px;
      font-size: 18px;
      text-align: center;
      color: #003DA5;
      font-family: 'Lucida Sans', sans-serif;
    }
    #nav {
      text-align: center;
      margin-top: 20px;
    }
    #nav button {
      background-color: white;
      color: #003DA5;
      border: 2px solid #003DA5;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 20px;
      font-family: 'Lucida Sans', sans-serif;
      cursor: pointer;
      margin: 0 8px;
      margin-bottom: 20px;
      transition: background-color 0.2s, color 0.2s;
    }
    #nav button:hover {
      background-color: #003DA5;
      color: white;
    }
    #region-select {
      font-size: 20px;
      padding: 10px 20px;
      border: 2px solid #003DA5;
      border-radius: 8px;
      color: #003DA5;
      font-family: 'Lucida Sans', sans-serif;
      cursor: pointer;
      outline: none;
      margin-bottom: 20px;
    }
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 16px 0;
    }
    .btn-page {
      background-color: white;
      color: #003DA5;
      border: 2px solid #003DA5;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 18px;
      font-family: 'Lucida Sans', sans-serif;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-page:hover:not(:disabled) {
      background-color: #003DA5;
      color: white;
    }
    .btn-page:disabled {
      opacity: 0.3;
      cursor: default;
    }
    </style>
  </head>
  <body>
    <main>
      <h1 id="titre-principal">Historique par région</h1>
      <div id="nav">
        <a href="index.html"><button>Accueil</button></a>
        <a href="aujourd-hui.html"><button>Prix aujourd'hui</button></a>
        <a href="historique.html"><button>Historique Québec</button></a>
        <a href="regions.html"><button>Prédiction par région</button></a>
      </div>

      <div>
        <select id="region-select" onchange="chargerRegion()"><option>Chargement...</option></select>
      </div>

      <div id="pagination">
        <button class="btn-page" id="btn-prev" onclick="changerPage(-1)" disabled>&#8592; Semaine précédente</button>
        <span id="label-semaine" style="font-size: 16px; color: #003DA5; min-width: 220px;"></span>
        <button class="btn-page" id="btn-next" onclick="changerPage(1)" disabled>Semaine suivante &#8594;</button>
      </div>

      <table id="tableau-historique" style="border-collapse: collapse; width: 100%;">
        <tr>
          <th style="padding: 8px; border: 4px solid #003DA5; background-color: #003DA5; color: white;">Date</th>
          <th id="th-region" style="padding: 8px; border: 4px solid #003DA5; background-color: #003DA5; color: white;">Prix moyen (¢/L)</th>
        </tr>
      </table>

      <p id="moyenne-semaine" style="margin-top: 20px; font-size: 16px;"></p>
    </main>

    <footer style="background-color: #003DA5; color: white; padding: 20px 40px; text-align: center;">
      <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Accueil</a>
      <a href="aujourd-hui.html" style="color: white; text-decoration: none; margin: 0 15px;">Prix aujourd'hui</a>
      <a href="prediction.html" style="color: white; text-decoration: none; margin: 0 15px;">Prédiction</a>
      <a href="regions.html" style="color: white; text-decoration: none; margin: 0 15px;">Prédiction par région</a>
      <a href="historique.html" style="color: white; text-decoration: none; margin: 0 15px;">Données historiques</a>
      <a href="historique-regions.html" style="color: white; text-decoration: none; margin: 0 15px;">Historique par région</a>
      <p style="font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 12px; margin-bottom: 0;">
        Conditions d'utilisation &nbsp;|&nbsp; Politique de confidentialité &nbsp;|&nbsp; Contactez-nous
      </p>
    </footer>

    <script>
      let allRows = [];
      let page = 0;

      function renderPage() {
        const start = page * 7;
        const semaine = allRows.slice(start, start + 7);

        const table = document.getElementById("tableau-historique");
        const header = table.rows[0];
        table.innerHTML = "";
        table.appendChild(header);

        if (semaine.length === 0) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="2" style="padding: 16px; color: #888;">Aucune donnée disponible pour cette région.</td>`;
          table.appendChild(tr);
          document.getElementById("moyenne-semaine").textContent = "";
          document.getElementById("label-semaine").textContent = "";
          document.getElementById("btn-prev").disabled = true;
          document.getElementById("btn-next").disabled = true;
          return;
        }

        semaine.forEach(([date, prix]) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="padding: 8px; border: 4px solid #003DA5;">${date}</td>
            <td style="padding: 8px; border: 4px solid #003DA5; color: #003DA5;">${parseFloat(prix).toFixed(1)}¢</td>`;
          table.appendChild(tr);
        });

        const moy = (semaine.reduce((s, [, p]) => s + parseFloat(p), 0) / semaine.length).toFixed(1);
        document.getElementById("moyenne-semaine").innerHTML =
          `Moyenne de la semaine : <span style="color: #003DA5; font-weight: bold;">${moy}¢/L</span> <span style="color: #888; font-size: 13px;">(${semaine.length} jour${semaine.length > 1 ? "s" : ""})</span>`;

        document.getElementById("label-semaine").textContent =
          `${semaine[semaine.length - 1][0]} → ${semaine[0][0]}`;

        document.getElementById("btn-prev").disabled = start + 7 >= allRows.length;
        document.getElementById("btn-next").disabled = page === 0;
      }

      function changerPage(dir) {
        page = Math.max(0, Math.min(page - dir, Math.ceil(allRows.length / 7) - 1));
        renderPage();
      }

      function chargerRegion() {
        const region = document.getElementById("region-select").value;
        document.getElementById("th-region").textContent = `${region} (¢/L)`;
        page = 0;

        const dateDebut = "2026-01-01";
        fetch(`https://proessence.up.railway.app/graphique/regions?region=${encodeURIComponent(region)}&date_debut=${dateDebut}`)
          .then(r => r.json())
          .then(data => {
            allRows = data.data.reverse().map(e => [e.date, e.prix]);
            renderPage();
          });
      }

      fetch("https://proessence.up.railway.app/prix/csv/regions")
        .then(r => r.text())
        .then(csv => {
          const regions = [...new Set(
            csv.trim().split("\n").slice(1).map(l => l.split(",")[1])
          )].sort();

          const select = document.getElementById("region-select");
          select.innerHTML = regions.map(r => `<option value="${r}">${r}</option>`).join("");
          chargerRegion();
        });
    </script>
  </body>
</html>
