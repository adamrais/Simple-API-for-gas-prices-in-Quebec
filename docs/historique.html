<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Données historiques</title>
    <style>
    body {
      background-color: white;  
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', sans-serif;
      padding: 20px;
      margin: 0;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
  }
    main {
      flex: 1;
    }
    #titre-principal {
      color: #003DA5;
      font-size: 120px;
      font-weight: bold;
      text-align: center;
      margin: 0;
      border-bottom: 4px solid #003DA5;
      padding: 10px 20px;
      display: inline-block;
  }
    h2 {
      margin-top: 4px;
      font-size: 18px;
      text-align: center;
      color: #003DA5;
      font-family: 'Lucida Sans', sans-serif;
  }
    #nav {
      text-align: center;
      margin-top: 20px;
  }
    #nav button {
      background-color: white;
      color: #003DA5;
      border: 2px solid #003DA5;
      border-radius: 8px;
      padding: 10px 28px;
      font-size: 20px;
      font-family: 'Lucida Sans', sans-serif;
      cursor: pointer;
      margin: 0 8px;
      margin-bottom: 20px; 
      transition: background-color 0.2s, color 0.2s;
  }
    #nav button:hover {
      background-color: #003DA5;
      color: white;
  }
    #btn-chercher {
      background-color: transparent;
      color: #003DA5;
      border: 1px solid #003DA5;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
  }
    #btn-chercher:hover {
      background-color: #003DA5;
      color: white;
  }
    </style>
  </head>
  <body>
    <main>
    <h1 id="titre-principal">Données historiques</h1>
    <div id="nav">
      <a href="index.html"><button>Accueil</button></a>
      <a href="aujourd-hui.html"><button>Prix aujourd'hui</button></a>
      <a href="prediction.html"><button>Prédiction</button></a>
      <a href="regions.html"><button>Prédiction par région</button></a>
    </div>
    <table id="tableau-historique" style="border-collapse: collapse; width: 100%;">
      <tr>
        <th style="padding: 8px; border: 4px solid #003DA5; background-color: #003DA5; color: white;">Date</th>
        <th style="padding: 8px; border: 4px solid #003DA5; background-color: #003DA5; color: white;">Prix moyen au Québec (¢/L)</th>
      </tr>
    </table>

    <p id="moyenne-semaine" style="margin-top: 20px; font-size: 16px;"></p>
    <hr style="margin-top: 10px;">
    <h2>Chercher une date spécifique</h2>
    <input type="date" id="date-input" style="border: 1px solid #003DA5; border-radius: 4px; background-color: transparent; color: #003DA5; padding: 8px 12px; font-size: 16px;">
    <button id="btn-chercher" onclick="chercher()">Chercher</button>
    <div id="resultat" style="margin-top: 20px;"></div>

    <script>
      fetch("https://proessence.up.railway.app/prix/csv")
        .then(r => r.text())
        .then(csv => {
          const lines = csv.trim().split("\n").slice(1).reverse();
          const table = document.getElementById("tableau-historique");
          lines.forEach(line => {
            const [date, prix] = line.split(",");
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td style="padding: 8px; border: 4px solid #003DA5;">${date}</td>
              <td style="padding: 8px; border: 4px solid #003DA5; color: #003DA5;">${prix}¢</td>`;
            table.appendChild(tr);
          });

          const semaine = lines.slice(0, 7).map(l => parseFloat(l.split(",")[1]));
          const moy = (semaine.reduce((a, b) => a + b, 0) / semaine.length).toFixed(1);
          document.getElementById("moyenne-semaine").innerHTML =
            `Moyenne de la semaine : <span style="color: #003DA5; font-weight: bold;">${moy}¢/L</span> <span style="color: #888; font-size: 13px;">(${semaine.length} jour${semaine.length > 1 ? "s" : ""})</span>`;
        });

      async function chercher() {
        const date = document.getElementById("date-input").value;
        const res = await fetch(`https://proessence.up.railway.app/prix?date=${date}`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById("resultat").textContent = `Prix le ${date} : ${data.prix} ¢/L`;
        } else {
          document.getElementById("resultat").textContent = "Aucune donnée pour cette date.";
        }
      }
    </script>
    </main>
    <footer style="background-color: #003DA5; color: white; padding: 20px 40px; text-align: center;">
      <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Accueil</a>
      <a href="aujourd-hui.html" style="color: white; text-decoration: none; margin: 0 15px;">Prix aujourd'hui</a>
      <a href="prediction.html" style="color: white; text-decoration: none; margin: 0 15px;">Prédiction</a>
      <a href="regions.html" style="color: white; text-decoration: none; margin: 0 15px;">Prédiction par région</a>
      <a href="historique.html" style="color: white; text-decoration: none; margin: 0 15px;">Données historiques</a>
      <p style="font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 12px; margin-bottom: 0;">
        Conditions d'utilisation &nbsp;|&nbsp; Politique de confidentialité &nbsp;|&nbsp; Contactez-nous
      </p>
    </footer>
  </body>
</html>
