<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Prix aujourd'hui</title>
    <style>
  body {
    background-color: white;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', sans-serif;
    padding: 20px;
    margin: 0;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
  }
  #titre-principal {
    color: #003DA5;
    font-size: 120px;
    font-weight: bold;
    text-align: center;
    margin: 0;
    border-bottom: 4px solid #003DA5;
    padding: 10px 20px;
    display: inline-block;
  }
  h2 {
    margin-top: 4px;
    font-size: 36px;
    text-align: center;
    color: gray;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', sans-serif;
  }
  #nav {
    text-align: center;
    margin-top: 40px;
  }
  #nav button {
    background-color: white;
    color: #003DA5;
    border: 2px solid #003DA5;
    border-radius: 8px;
    padding: 10px 28px;
    font-size: 20px;
    font-family: 'Lucida Sans', sans-serif;
    cursor: pointer;
    margin: 0 8px;
    transition: background-color 0.2s, color 0.2s;
  }
  #nav button:hover {
    background-color: #003DA5;
    color: white;
  }
    </style>
  </head>
  <body>
    <main>
    <h1 id="titre-principal">Prix aujourd'hui</h1>
    <div id="nav">
      <a href="index.html"><button>Page d'accueil</button></a>
      <a href="historique.html"><button>Données historiques</button></a>
    </div>
    <div style="margin-top: 20px;">
      <p style="font-size: 16px; color: #003DA5; margin: 5px 0;">Prix moyen à la pompe au Québec :</p>
      <h1 id="prix" style="font-size: 72px; margin: 0;">Chargement...</h1>
      <p id="baril" style="font-size: 18px; margin: 5px 0;">Chargement...</p>
      <p id="date" style="font-size: 14px; color: gray;margin: 5px 0;">Chargement...</p>
    </div>
      <h2 id="tendance" style="font-size: 28px;">Chargement...</h2>
    <script>
    fetch("https://simple-api-for-gas-prices-in-quebec.onrender.com/predict")
    .then(reponse => reponse.json())
    .then(data => {
      document.getElementById("prix").textContent = data.prix_predit_cents + " ¢/L";
      document.getElementById("baril").textContent = data.wti_usd + " USD$";
      document.getElementById("date").textContent = data.date;
      const tendanceEl = document.getElementById("tendance");
        tendanceEl.textContent = data.tendance;
        if (data.tendance.includes("hausse")) {
            tendanceEl.style.color = "red";
        } else if (data.tendance.includes("baisse")) {
            tendanceEl.style.color = "green";
        } else {
            tendanceEl.style.color = "gray";
        }
    })
    </script>
    </main>
    <footer style="background-color: #003DA5; color: white; padding: 20px 40px; text-align: center;">
      <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Accueil</a>
      <a href="aujourd-hui.html" style="color: white; text-decoration: none; margin: 0 15px;">Prix aujourd'hui</a>
      <a href="prediction.html" style="color: white; text-decoration: none; margin: 0 15px;">Prédiction</a>
      <a href="historique.html" style="color: white; text-decoration: none; margin: 0 15px;">Données historiques</a>
      <p style="font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 12px; margin-bottom: 0;">
        Conditions d'utilisation &nbsp;|&nbsp; Politique de confidentialité &nbsp;|&nbsp; Contactez-nous
      </p>
    </footer>
  </body>
</html>
